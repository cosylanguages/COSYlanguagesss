name: CI Link and HTML Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate JSON Schemas and Content Examples
        run: |
          node scripts/validate-schema.js

      - name: Verify Vocabulary Pool Minimum Thresholds
        run: |
          node scripts/verify_vocab_pool.js

      - name: Validate Public Entry Pages
        run: npx html-validate index.html login.html privacy.html placement-quiz.html vocabulary/index.html 'languages/*/index.html' 'languages/fr/marathon*.html' 'languages/fr/marathon/*.html'

      - name: Check JavaScript Syntax
        run: npm run check:js-syntax

      - name: Check Inline JavaScript Syntax
        run: npm run check:inline-js

      - name: Install Playwright Browsers for Smoke Test
        run: npx playwright install chromium

      - name: Run Smoke Checks
        run: npm run check:smoke

      - name: Run Grammar Logic Tests
        run: >-
          npx playwright test
          project/tests/adjective_architecture_validation.spec.ts
          project/tests/relational_architecture_validation.spec.ts
          --reporter=line

      - name: Check Canonical Footer Consistency
        run: |
          npm run check:footer

      - name: Check Founder Name Policy
        run: |
          npm run check:names

      - name: Validate Site HTML
        run: |
          npx html-validate "*.html" "practice/*.html" "games/*.html" "vocabulary/*.html" "hybrid/*.html"

      - name: Validate Generated Blog Pages
        run: >-
          npx html-validate
          blog/top-100-a0-a1*.html
          blog/replace-50-overused-phrases*.html
          blog/replace-very-50-stronger-adjectives*.html
          blog/stop-translating-10-sentence-frames*.html
          blog/top-10-verb-synonyms-intermediate-plateau*.html
          blog/welcome-to-cosy-blog.html

      - name: Run internal link verification
        run: |
          python3 project/scripts/audits/link_checker.py
