name: Build Blog Static Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'blog/posts/**'
      - 'blog/guides.json'
      - 'scripts/build-blog.js'
  workflow_dispatch:

jobs:
  build-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Blog Posts & JSON
        run: node scripts/build-blog.js

      - name: Commit generated blog files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*.html blog/posts.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[skip ci] build: regenerate blog html pages and posts.json"
            git push
          fi
