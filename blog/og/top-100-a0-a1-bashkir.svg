<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-bashkir" data-lang="ba">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="343,261 279,449 118,502 3,312 -32,195 120,72 276,66" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1238,617 1122,943 836,904 604,649 851,370 1133,343" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="988,455 867,631 644,594 674,357 868,321" fill="#205634" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="956,508 859,598 755,495 856,415" fill="#205634" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1314,131 1145,329 899,349 759,185 944,0 1169,-5" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="811,231 678,500 470,464 317,265 385,62 631,87" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1435,127 1333,356 1031,431 811,96 991,-73 1332,-102" fill="#205634" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(3 390.5 240)">
        <rect x="232" y="110" width="317" height="260" rx="6" fill="#205634" opacity="0.3" stroke="#205634" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(9 471 393.5)">
        <rect x="229" y="264" width="484" height="259" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#205634" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="967,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 987,157.5 967,0" fill="#FCF9F2" opacity="0.9" stroke="#205634" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-2 451 38)" filter="url(#soft-shadow)">
      <rect x="391" y="26" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="391" y1="26" x2="391" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="511" y1="26" x2="511" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#205634" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 996 58 Q 996 70 1008 70 Q 996 70 996 82 Q 996 70 984 70 Q 996 70 996 58 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1041 100 Q 1041 108 1049 108 Q 1041 108 1041 116 Q 1041 108 1033 108 Q 1041 108 1041 100 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 75 148 C 85 133, 70 113, 90 98" />
      <circle cx="79" cy="133" r="3" fill="#205634" opacity="0.5" />
      <circle cx="85" cy="116" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 81 577 Q 193 583 304 578" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 91 580 Q 193 586 294 579" stroke="#205634" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="448" width="1152" height="158" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#205634" stroke-width="1.2" />
        <text x="54" y="486" fill="#205634" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">РЕСУРСТАР ИСЕМЛЕГЕ • Vol. 2026.08</text>
        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 Bashkir A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>