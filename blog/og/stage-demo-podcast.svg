      <ellipse cx="736" cy="533" rx="145" ry="86" fill="#4a5568" opacity="0.15" transform="rotate(157 736 533)" style="filter: blur(12px);" />
      <ellipse cx="746" cy="528" rx="87" ry="51.6" fill="#225B58" opacity="0.12" transform="rotate(157 736 533)" style="filter: blur(8px);" />

      <ellipse cx="508" cy="28" rx="96" ry="82" fill="#4a5568" opacity="0.15" transform="rotate(359 508 28)" style="filter: blur(12px);" />
      <ellipse cx="518" cy="23" rx="57.599999999999994" ry="49.199999999999996" fill="#225B58" opacity="0.12" transform="rotate(359 508 28)" style="filter: blur(8px);" />

