<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="replace-50-overused-phrases-fr" data-lang="fr">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="1136" cy="220" rx="155" ry="113" fill="#faf7f2" opacity="0.15" transform="rotate(255 1136 220)" style="filter: blur(12px);" />
      <ellipse cx="1146" cy="215" rx="93" ry="67.8" fill="#274B7D" opacity="0.12" transform="rotate(255 1136 220)" style="filter: blur(8px);" />

      <ellipse cx="633" cy="21" rx="99" ry="77" fill="#faf7f2" opacity="0.15" transform="rotate(290 633 21)" style="filter: blur(12px);" />
      <ellipse cx="643" cy="16" rx="59.4" ry="46.199999999999996" fill="#274B7D" opacity="0.12" transform="rotate(290 633 21)" style="filter: blur(8px);" />

      <ellipse cx="305" cy="623" rx="185" ry="119" fill="#faf7f2" opacity="0.15" transform="rotate(10 305 623)" style="filter: blur(12px);" />
      <ellipse cx="315" cy="618" rx="111" ry="71.39999999999999" fill="#274B7D" opacity="0.12" transform="rotate(10 305 623)" style="filter: blur(8px);" />

      <ellipse cx="232" cy="553" rx="194" ry="63" fill="#faf7f2" opacity="0.15" transform="rotate(242 232 553)" style="filter: blur(12px);" />
      <ellipse cx="242" cy="548" rx="116.39999999999999" ry="37.8" fill="#274B7D" opacity="0.12" transform="rotate(242 232 553)" style="filter: blur(8px);" />



      <g transform="rotate(1 751.5 392)">
        <rect x="561" y="247" width="381" height="290" rx="6" fill="#d69e2e" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-10 616 391.5)">
        <rect x="392" y="226" width="448" height="331" rx="6" fill="#274B7D" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="974,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 994,157.5 974,0" fill="#FCF9F2" opacity="0.9" stroke="#274B7D" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(8 779 36)" filter="url(#soft-shadow)">
      <rect x="719" y="24" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="719" y1="24" x2="719" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="839" y1="24" x2="839" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#274B7D" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 937 38 Q 937 50 949 50 Q 937 50 937 62 Q 937 50 925 50 Q 937 50 937 38 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 982 80 Q 982 88 990 88 Q 982 88 982 96 Q 982 88 974 88 Q 982 88 982 80 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 47 124 C 57 109, 42 89, 62 74" />
      <circle cx="51" cy="109" r="3" fill="#274B7D" opacity="0.5" />
      <circle cx="57" cy="92" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 89 600 Q 201 596 312 600" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 99 603 Q 201 599 302 602" stroke="#274B7D" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • WORDS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="451" width="1152" height="155" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#274B7D" stroke-width="1.2" />
        <text x="54" y="489" fill="#274B7D" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">WORDS • Vol. 2026.09</text>
        <text x="54" y="523" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">Arrêtez de dire ces 50 expressions</text>
<text x="54" y="550" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">répétitives ! Alternatives naturelles</text>
<text x="54" y="577" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">pour le niveau intermédiaire</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>