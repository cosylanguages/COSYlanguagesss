<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="replace-very-50-stronger-adjectives-ru" data-lang="ru">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="494" cy="266" rx="164" ry="138" fill="#faf7f2" opacity="0.15" transform="rotate(218 494 266)" style="filter: blur(12px);" />
      <ellipse cx="504" cy="261" rx="98.39999999999999" ry="82.8" fill="#A03224" opacity="0.12" transform="rotate(218 494 266)" style="filter: blur(8px);" />

      <ellipse cx="1050" cy="154" rx="185" ry="114" fill="#faf7f2" opacity="0.15" transform="rotate(324 1050 154)" style="filter: blur(12px);" />
      <ellipse cx="1060" cy="149" rx="111" ry="68.39999999999999" fill="#A03224" opacity="0.12" transform="rotate(324 1050 154)" style="filter: blur(8px);" />

      <ellipse cx="306" cy="180" rx="163" ry="80" fill="#faf7f2" opacity="0.15" transform="rotate(205 306 180)" style="filter: blur(12px);" />
      <ellipse cx="316" cy="175" rx="97.8" ry="48" fill="#A03224" opacity="0.12" transform="rotate(205 306 180)" style="filter: blur(8px);" />

      <ellipse cx="1080" cy="456" rx="201" ry="149" fill="#faf7f2" opacity="0.15" transform="rotate(349 1080 456)" style="filter: blur(12px);" />
      <ellipse cx="1090" cy="451" rx="120.6" ry="89.39999999999999" fill="#A03224" opacity="0.12" transform="rotate(349 1080 456)" style="filter: blur(8px);" />

      <ellipse cx="601" cy="145" rx="148" ry="68" fill="#faf7f2" opacity="0.15" transform="rotate(223 601 145)" style="filter: blur(12px);" />
      <ellipse cx="611" cy="140" rx="88.8" ry="40.8" fill="#A03224" opacity="0.12" transform="rotate(223 601 145)" style="filter: blur(8px);" />

      <ellipse cx="533" cy="117" rx="153" ry="68" fill="#faf7f2" opacity="0.15" transform="rotate(59 533 117)" style="filter: blur(12px);" />
      <ellipse cx="543" cy="112" rx="91.8" ry="40.8" fill="#A03224" opacity="0.12" transform="rotate(59 533 117)" style="filter: blur(8px);" />



      <g transform="rotate(-7 822 297.5)">
        <rect x="572" y="185" width="500" height="225" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-2 354.5 364)">
        <rect x="190" y="256" width="329" height="216" rx="6" fill="#d69e2e" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(4 608.5 202)">
        <rect x="456" y="100" width="305" height="204" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="965,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 985,157.5 965,0" fill="#FCF9F2" opacity="0.9" stroke="#A03224" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-3 638 41)" filter="url(#soft-shadow)">
      <rect x="578" y="29" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="578" y1="29" x2="578" y2="53" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="698" y1="29" x2="698" y2="53" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#A03224" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 914 85 Q 914 97 926 97 Q 914 97 914 109 Q 914 97 902 97 Q 914 97 914 85 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 959 127 Q 959 135 967 135 Q 959 135 959 143 Q 959 135 951 135 Q 959 135 959 127 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 57 100 C 67 85, 52 65, 72 50" />
      <circle cx="61" cy="85" r="3" fill="#A03224" opacity="0.5" />
      <circle cx="67" cy="68" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 73 576 Q 204 573 335 576" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 83 579 Q 204 576 325 578" stroke="#A03224" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • WORDS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#A03224" stroke-width="1.2" />
        <text x="54" y="474" fill="#A03224" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">СЛОВА • Vol. 2026.09</text>
        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Хватит говорить 'Очень'! 50</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">сильных прилагательных для</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">богатого словарного запаса</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>