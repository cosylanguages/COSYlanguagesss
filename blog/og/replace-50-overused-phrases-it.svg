<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="replace-50-overused-phrases-it" data-lang="it">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="65" cy="465" rx="203" ry="149" fill="#faf7f2" opacity="0.15" transform="rotate(313 65 465)" style="filter: blur(12px);" />
      <ellipse cx="75" cy="460" rx="121.8" ry="89.39999999999999" fill="#3A6332" opacity="0.12" transform="rotate(313 65 465)" style="filter: blur(8px);" />

      <ellipse cx="919" cy="50" rx="173" ry="66" fill="#faf7f2" opacity="0.15" transform="rotate(218 919 50)" style="filter: blur(12px);" />
      <ellipse cx="929" cy="45" rx="103.8" ry="39.6" fill="#3A6332" opacity="0.12" transform="rotate(218 919 50)" style="filter: blur(8px);" />

      <ellipse cx="481" cy="168" rx="128" ry="134" fill="#faf7f2" opacity="0.15" transform="rotate(345 481 168)" style="filter: blur(12px);" />
      <ellipse cx="491" cy="163" rx="76.8" ry="80.39999999999999" fill="#3A6332" opacity="0.12" transform="rotate(345 481 168)" style="filter: blur(8px);" />

      <ellipse cx="52" cy="568" rx="124" ry="137" fill="#faf7f2" opacity="0.15" transform="rotate(174 52 568)" style="filter: blur(12px);" />
      <ellipse cx="62" cy="563" rx="74.39999999999999" ry="82.2" fill="#3A6332" opacity="0.12" transform="rotate(174 52 568)" style="filter: blur(8px);" />



      <g transform="rotate(9 293.5 226.5)">
        <rect x="99" y="101" width="389" height="251" rx="6" fill="#faf7f2" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-1 389 241.5)">
        <rect x="192" y="122" width="394" height="239" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(9 678.5 239.5)">
        <rect x="448" y="79" width="461" height="321" rx="6" fill="#d69e2e" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="982,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1002,157.5 982,0" fill="#FCF9F2" opacity="0.9" stroke="#3A6332" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-4 541 38)" filter="url(#soft-shadow)">
      <rect x="481" y="26" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="481" y1="26" x2="481" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="601" y1="26" x2="601" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 875 36 Q 875 48 887 48 Q 875 48 875 60 Q 875 48 863 48 Q 875 48 875 36 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 920 78 Q 920 86 928 86 Q 920 86 920 94 Q 920 86 912 86 Q 920 86 920 78 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 73 130 C 83 115, 68 95, 88 80" />
      <circle cx="77" cy="115" r="3" fill="#3A6332" opacity="0.5" />
      <circle cx="83" cy="98" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 51 582 Q 176 583 300 580" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 61 585 Q 176 586 290 584" stroke="#3A6332" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • WORDS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#3A6332" stroke-width="1.2" />
        <text x="54" y="474" fill="#3A6332" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">WORDS • Vol. 2026.09</text>
        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Basta ripetere queste 50 frasi!</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Alternative naturali per il</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">livello intermedio</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>