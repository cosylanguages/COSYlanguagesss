      <polygon points="753,460 499,618 270,502 514,290" fill="#225B58" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-2 835 429)">
        <rect x="589" y="261" width="492" height="336" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-7 486 348)">
