<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-greek" data-lang="el">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="620,495 555,562 467,567 397,544 373,415 447,345 542,401" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="531,83 -59,351 2,-171" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1129,420 1071,470 999,494 933,407 992,328 1074,352" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="848,449 701,699 425,424 690,311" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1050,324 1005,545 809,664 644,411 562,189 820,49 1040,100" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1210,130 1141,239 1047,260 972,180 1001,80 1067,34 1162,63" fill="#236583" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-10 708 229)">
        <rect x="482" y="85" width="452" height="288" rx="6" fill="#236583" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(1 733.5 285)">
        <rect x="580" y="150" width="307" height="270" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(10 772.5 342.5)">
        <rect x="554" y="223" width="437" height="239" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="947,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 967,157.5 947,0" fill="#FCF9F2" opacity="0.9" stroke="#236583" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-7 630 40)" filter="url(#soft-shadow)">
      <rect x="570" y="28" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="570" y1="28" x2="570" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="690" y1="28" x2="690" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#236583" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 891 42 Q 891 54 903 54 Q 891 54 891 66 Q 891 54 879 54 Q 891 54 891 42 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 936 84 Q 936 92 944 92 Q 936 92 936 100 Q 936 92 928 92 Q 936 92 936 84 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 54 147 C 64 132, 49 112, 69 97" />
      <circle cx="58" cy="132" r="3" fill="#236583" opacity="0.5" />
      <circle cx="64" cy="115" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 76 584 Q 187 579 297 585" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 86 587 Q 187 582 287 586" stroke="#236583" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="448" width="1152" height="158" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#236583" stroke-width="1.2" />
        <text x="54" y="486" fill="#236583" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ΕΛΛΗΝΙΚΑ A0–A1 ΛΙΣΤΑ • Vol. 2026.08</text>
        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 Greek A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>