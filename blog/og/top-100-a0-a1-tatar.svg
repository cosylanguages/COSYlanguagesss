        <rect x="634" y="265" width="431" height="235" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#1A6360" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-6 559.5 351)">
