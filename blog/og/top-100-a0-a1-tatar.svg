      <polygon points="1436,113 1118,371 854,85 1156,-123" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(9 356.5 236)">
        <rect x="196" y="77" width="321" height="318" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#1A6360" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

