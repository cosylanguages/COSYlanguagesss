<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="top-10-verb-synonyms-intermediate-plateau-el" data-lang="el">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="940" cy="625" rx="170" ry="125" fill="#faf7f2" opacity="0.15" transform="rotate(29 940 625)" style="filter: blur(12px);" />
      <ellipse cx="950" cy="620" rx="102" ry="75" fill="#236583" opacity="0.12" transform="rotate(29 940 625)" style="filter: blur(8px);" />

      <ellipse cx="764" cy="518" rx="186" ry="64" fill="#faf7f2" opacity="0.15" transform="rotate(339 764 518)" style="filter: blur(12px);" />
      <ellipse cx="774" cy="513" rx="111.6" ry="38.4" fill="#236583" opacity="0.12" transform="rotate(339 764 518)" style="filter: blur(8px);" />

      <ellipse cx="314" cy="2" rx="183" ry="113" fill="#faf7f2" opacity="0.15" transform="rotate(55 314 2)" style="filter: blur(12px);" />
      <ellipse cx="324" cy="-3" rx="109.8" ry="67.8" fill="#236583" opacity="0.12" transform="rotate(55 314 2)" style="filter: blur(8px);" />

      <ellipse cx="322" cy="272" rx="193" ry="63" fill="#faf7f2" opacity="0.15" transform="rotate(118 322 272)" style="filter: blur(12px);" />
      <ellipse cx="332" cy="267" rx="115.8" ry="37.8" fill="#236583" opacity="0.12" transform="rotate(118 322 272)" style="filter: blur(8px);" />



      <g transform="rotate(3 297 299.5)">
        <rect x="108" y="196" width="378" height="207" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-1 704 382.5)">
        <rect x="540" y="261" width="328" height="243" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="1012,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1032,157.5 1012,0" fill="#FCF9F2" opacity="0.9" stroke="#236583" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(6 483 27)" filter="url(#soft-shadow)">
      <rect x="423" y="15" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="423" y1="15" x2="423" y2="39" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="543" y1="15" x2="543" y2="39" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#236583" stroke-width="1.5" fill="none" opacity="0.7">
