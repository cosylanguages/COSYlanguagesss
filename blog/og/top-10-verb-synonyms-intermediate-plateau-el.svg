      <path d="M 933 53 Q 933 65 945 65 Q 933 65 933 77 Q 933 65 921 65 Q 933 65 933 53 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 978 95 Q 978 103 986 103 Q 978 103 978 111 Q 978 103 970 103 Q 978 103 978 95 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 48 138 C 58 123, 43 103, 63 88" />
      <circle cx="52" cy="123" r="3" fill="#236583" opacity="0.5" />
      <circle cx="58" cy="106" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 42 577 Q 178 583 314 575" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 52 580 Q 178 586 304 579" stroke="#236583" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • WORDS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#236583" stroke-width="1.2" />
        <text x="54" y="474" fill="#236583" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ΛΕΞΕΙΣ • Vol. 2026.09</text>
        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Τα 10 πιο συχνά ρήματα και τα</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">ακριβή συνώνυμά τους για το</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">ενδιάμεσο επίπεδο (B1–B2)</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>