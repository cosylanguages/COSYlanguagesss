<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-german" data-lang="de">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="1285,416 892,606 917,231" fill="#A86C1B" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="772,456 670,672 370,761 175,540 254,377 442,111 678,255" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="542,52 267,245 191,-177" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="955,363 769,472 748,280" fill="#A86C1B" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1012,125 923,237 797,197 767,43 965,-12" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(2 412 397)">
        <rect x="194" y="243" width="436" height="308" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#A86C1B" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-7 555 329.5)">
        <rect x="401" y="191" width="308" height="277" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A86C1B" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(6 728.5 348)">
        <rect x="526" y="207" width="405" height="282" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A86C1B" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-1 562.5 403.5)">
        <rect x="380" y="234" width="365" height="339" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#A86C1B" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="994,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1014,157.5 994,0" fill="#FCF9F2" opacity="0.9" stroke="#A86C1B" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-5 183 36)" filter="url(#soft-shadow)">
      <rect x="123" y="24" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="123" y1="24" x2="123" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="243" y1="24" x2="243" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#A86C1B" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 853 76 Q 853 88 865 88 Q 853 88 853 100 Q 853 88 841 88 Q 853 88 853 76 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 898 118 Q 898 126 906 126 Q 898 126 898 134 Q 898 126 890 126 Q 898 126 898 118 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 57 113 C 67 98, 52 78, 72 63" />
      <circle cx="61" cy="98" r="3" fill="#A86C1B" opacity="0.5" />
      <circle cx="67" cy="81" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 40 589 Q 164 589 287 589" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 50 592 Q 164 592 277 591" stroke="#A86C1B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="448" width="1152" height="158" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#A86C1B" stroke-width="1.2" />
        <text x="54" y="486" fill="#A86C1B" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">GERMAN A0–A1 MASTER LIST • Vol. 2026.08</text>
        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 German A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>