      <path d="M 991 48 Q 991 60 1003 60 Q 991 60 991 72 Q 991 60 979 60 Q 991 60 991 48 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1036 90 Q 1036 98 1044 98 Q 1036 98 1036 106 Q 1036 98 1028 98 Q 1036 98 1036 90 Z" stroke="#faf7f2" stroke-width="1" />
