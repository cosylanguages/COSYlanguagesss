      <ellipse cx="353" cy="473" rx="155" ry="118" fill="#faf7f2" opacity="0.15" transform="rotate(344 353 473)" style="filter: blur(12px);" />
      <ellipse cx="363" cy="468" rx="93" ry="70.8" fill="#274B7D" opacity="0.12" transform="rotate(344 353 473)" style="filter: blur(8px);" />

      <ellipse cx="730" cy="286" rx="204" ry="70" fill="#faf7f2" opacity="0.15" transform="rotate(263 730 286)" style="filter: blur(12px);" />
      <ellipse cx="740" cy="281" rx="122.39999999999999" ry="42" fill="#274B7D" opacity="0.12" transform="rotate(263 730 286)" style="filter: blur(8px);" />

      <ellipse cx="191" cy="120" rx="174" ry="142" fill="#faf7f2" opacity="0.15" transform="rotate(304 191 120)" style="filter: blur(12px);" />
