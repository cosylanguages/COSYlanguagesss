        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Arrêtez de dire 'Très' ! 50</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">adjectifs forts pour enrichir</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">votre vocabulaire</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>