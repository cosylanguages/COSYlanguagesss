      <ellipse cx="320" cy="245" rx="106.2" ry="82.8" fill="#274B7D" opacity="0.12" transform="rotate(333 310 250)" style="filter: blur(8px);" />

      <ellipse cx="1020" cy="544" rx="115" ry="81" fill="#faf7f2" opacity="0.15" transform="rotate(212 1020 544)" style="filter: blur(12px);" />
      <ellipse cx="1030" cy="539" rx="69" ry="48.6" fill="#274B7D" opacity="0.12" transform="rotate(212 1020 544)" style="filter: blur(8px);" />



      <g transform="rotate(-5 439 266.5)">
