<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="overcoming-intermediate-plateau" data-lang="en">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="863" cy="269" rx="150" ry="138" fill="#faf7f2" opacity="0.15" transform="rotate(297 863 269)" style="filter: blur(12px);" />
      <ellipse cx="873" cy="264" rx="90" ry="82.8" fill="#225B58" opacity="0.12" transform="rotate(297 863 269)" style="filter: blur(8px);" />

      <ellipse cx="916" cy="289" rx="97" ry="89" fill="#faf7f2" opacity="0.15" transform="rotate(105 916 289)" style="filter: blur(12px);" />
      <ellipse cx="926" cy="284" rx="58.199999999999996" ry="53.4" fill="#225B58" opacity="0.12" transform="rotate(105 916 289)" style="filter: blur(8px);" />

      <ellipse cx="832" cy="358" rx="153" ry="142" fill="#faf7f2" opacity="0.15" transform="rotate(38 832 358)" style="filter: blur(12px);" />
      <ellipse cx="842" cy="353" rx="91.8" ry="85.2" fill="#225B58" opacity="0.12" transform="rotate(38 832 358)" style="filter: blur(8px);" />

      <ellipse cx="61" cy="492" rx="175" ry="116" fill="#faf7f2" opacity="0.15" transform="rotate(214 61 492)" style="filter: blur(12px);" />
      <ellipse cx="71" cy="487" rx="105" ry="69.6" fill="#225B58" opacity="0.12" transform="rotate(214 61 492)" style="filter: blur(8px);" />



      <g transform="rotate(-1 546 371.5)">
        <rect x="324" y="203" width="444" height="337" rx="6" fill="#225B58" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-3 647.5 225)">
        <rect x="497" y="91" width="301" height="268" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="986,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1006,157.5 986,0" fill="#FCF9F2" opacity="0.9" stroke="#225B58" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-7 746 40)" filter="url(#soft-shadow)">
      <rect x="686" y="28" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="686" y1="28" x2="686" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="806" y1="28" x2="806" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#225B58" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 1071 56 Q 1071 68 1083 68 Q 1071 68 1071 80 Q 1071 68 1059 68 Q 1071 68 1071 56 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1116 98 Q 1116 106 1124 106 Q 1116 106 1116 114 Q 1116 106 1108 106 Q 1116 106 1116 98 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 78 126 C 88 111, 73 91, 93 76" />
      <circle cx="82" cy="111" r="3" fill="#225B58" opacity="0.5" />
      <circle cx="88" cy="94" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 70 573 Q 185 573 299 575" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 80 576 Q 185 576 289 575" stroke="#225B58" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="460" width="1152" height="146" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#225B58" stroke-width="1.2" />
        <text x="54" y="498" fill="#225B58" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">LONG READS • Vol. 2026.09</text>
        <text x="54" y="536" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Overcoming the Intermediate</text>
<text x="54" y="572" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Plateau (B1 to B2)</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>