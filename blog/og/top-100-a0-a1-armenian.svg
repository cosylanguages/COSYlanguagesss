        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 Armenian A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
