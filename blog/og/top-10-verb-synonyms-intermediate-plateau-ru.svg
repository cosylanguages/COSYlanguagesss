      <ellipse cx="541" cy="180" rx="73.2" ry="44.4" fill="#A03224" opacity="0.12" transform="rotate(278 531 185)" style="filter: blur(8px);" />

      <ellipse cx="99" cy="319" rx="168" ry="73" fill="#faf7f2" opacity="0.15" transform="rotate(258 99 319)" style="filter: blur(12px);" />
