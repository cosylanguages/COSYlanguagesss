<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-italian" data-lang="it">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="851,224 764,448 458,494 377,237 467,47 670,74" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="590,26 527,177 417,148 322,127 353,-40 410,-65 550,-84" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="224,20 165,153 -4,146 -55,23 20,-166 165,-175" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="602,264 373,384 336,84" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="779,624 748,771 604,730 477,609 544,471 711,516" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1279,13 1258,90 1142,87 1100,14 1142,-56 1251,-72" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="619,-1 464,208 127,275 -14,34 183,-280 450,-194" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(6 444.5 358.5)">
        <rect x="239" y="257" width="411" height="203" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(6 879 278.5)">
        <rect x="658" y="110" width="442" height="337" rx="6" fill="#3A6332" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="951,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 971,157.5 951,0" fill="#FCF9F2" opacity="0.9" stroke="#3A6332" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(8 1040 46)" filter="url(#soft-shadow)">
      <rect x="980" y="34" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="980" y1="34" x2="980" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="1100" y1="34" x2="1100" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 1061 88 Q 1061 100 1073 100 Q 1061 100 1061 112 Q 1061 100 1049 100 Q 1061 100 1061 88 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1106 130 Q 1106 138 1114 138 Q 1106 138 1106 146 Q 1106 138 1098 138 Q 1106 138 1106 130 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 58 111 C 68 96, 53 76, 73 61" />
      <circle cx="62" cy="96" r="3" fill="#3A6332" opacity="0.5" />
      <circle cx="68" cy="79" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 74 596 Q 174 594 273 593" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 84 599 Q 174 597 263 598" stroke="#3A6332" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="448" width="1152" height="158" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#3A6332" stroke-width="1.2" />
        <text x="54" y="486" fill="#3A6332" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ITALIAN A0–A1 MASTER LIST • Vol. 2026.08</text>
        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 Italian A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>