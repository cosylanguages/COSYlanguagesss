<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-spanish" data-lang="es">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="950,408 949,498 840,515 755,451 779,381 837,301 921,331" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="804,464 432,631 115,417 492,29" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="941,272 443,659 474,100" fill="#B05322" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="848,24 619,211 482,61 607,-169" fill="#B05322" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="130,171 90,255 12,249 -2,193 16,108 78,140" fill="#B05322" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="689,151 562,511 136,406 29,216 64,-102 443,-49" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1336,562 1122,680 1142,461" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="673,63 579,150 468,105 410,-54 574,-125" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-4 540 336.5)">
        <rect x="378" y="183" width="324" height="307" rx="6" fill="#B05322" opacity="0.3" stroke="#B05322" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-3 398 238.5)">
        <rect x="202" y="126" width="392" height="225" rx="6" fill="#FAF6EE" opacity="0.3" stroke="#B05322" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(4 775 286)">
        <rect x="607" y="176" width="336" height="220" rx="6" fill="#B05322" opacity="0.3" stroke="#B05322" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="980,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1000,157.5 980,0" fill="#FCF9F2" opacity="0.9" stroke="#B05322" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(2 459 46)" filter="url(#soft-shadow)">
      <rect x="399" y="34" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="399" y1="34" x2="399" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="519" y1="34" x2="519" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#B05322" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 996 28 Q 996 40 1008 40 Q 996 40 996 52 Q 996 40 984 40 Q 996 40 996 28 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1041 70 Q 1041 78 1049 78 Q 1041 78 1041 86 Q 1041 78 1033 78 Q 1041 78 1041 70 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 39 121 C 49 106, 34 86, 54 71" />
      <circle cx="43" cy="106" r="3" fill="#B05322" opacity="0.5" />
      <circle cx="49" cy="89" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 85 578 Q 221 584 356 576" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 95 581 Q 221 587 346 580" stroke="#B05322" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • LONG READS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="448" width="1152" height="158" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#B05322" stroke-width="1.2" />
        <text x="54" y="486" fill="#B05322" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">SPANISH A0–A1 MASTER LIST • Vol. 2026.08</text>
        <text x="54" y="529" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Top 100 Spanish A0–A1</text>
<text x="54" y="571" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="33" font-weight="bold">Master Guide</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>