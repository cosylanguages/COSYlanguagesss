<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-100-a0-a1-breton" data-lang="br">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#FAF6EE" />

      <polygon points="605,524 508,664 378,596 275,508 340,361 488,314" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="563,216 152,375 191,-22" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="893,395 798,506 689,542 588,416 648,310 791,343" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1570,467 1237,848 816,534 1227,189" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="942,-4 890,143 740,236 640,70 661,-49 708,-210 884,-112" fill="#254E63" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1280,110 1090,239 1101,18" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1083,201 841,474 589,465 658,124 911,25" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="340,629 254,691 172,688 105,610 154,520 287,520" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-9 417 260.5)">
        <rect x="198" y="104" width="438" height="313" rx="6" fill="#faf7f2" opacity="0.3" stroke="#254E63" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(4 343.5 253)">
        <rect x="133" y="144" width="421" height="218" rx="6" fill="#faf7f2" opacity="0.3" stroke="#254E63" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="947,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 967,157.5 947,0" fill="#FCF9F2" opacity="0.9" stroke="#254E63" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(-8 930 34)" filter="url(#soft-shadow)">
      <rect x="870" y="22" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="870" y1="22" x2="870" y2="46" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="990" y1="22" x2="990" y2="46" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#254E63" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 1021 61 Q 1021 73 1033 73 Q 1021 73 1021 85 Q 1021 73 1009 73 Q 1021 73 1021 61 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1066 103 Q 1066 111 1074 111 Q 1066 111 1066 119 Q 1066 111 1058 111 Q 1066 111 1066 103 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 33 137 C 43 122, 28 102, 48 87" />
      <circle cx="37" cy="122" r="3" fill="#254E63" opacity="0.5" />
      <circle cx="43" cy="105" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
