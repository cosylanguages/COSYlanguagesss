<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="replace-very-50-stronger-adjectives-it" data-lang="it">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="303" cy="179" rx="169" ry="144" fill="#faf7f2" opacity="0.15" transform="rotate(333 303 179)" style="filter: blur(12px);" />
      <ellipse cx="313" cy="174" rx="101.39999999999999" ry="86.39999999999999" fill="#3A6332" opacity="0.12" transform="rotate(333 303 179)" style="filter: blur(8px);" />

      <ellipse cx="1178" cy="50" rx="186" ry="104" fill="#faf7f2" opacity="0.15" transform="rotate(119 1178 50)" style="filter: blur(12px);" />
      <ellipse cx="1188" cy="45" rx="111.6" ry="62.4" fill="#3A6332" opacity="0.12" transform="rotate(119 1178 50)" style="filter: blur(8px);" />

      <ellipse cx="183" cy="180" rx="100" ry="128" fill="#faf7f2" opacity="0.15" transform="rotate(323 183 180)" style="filter: blur(12px);" />
      <ellipse cx="193" cy="175" rx="60" ry="76.8" fill="#3A6332" opacity="0.12" transform="rotate(323 183 180)" style="filter: blur(8px);" />

      <ellipse cx="764" cy="510" rx="172" ry="104" fill="#faf7f2" opacity="0.15" transform="rotate(36 764 510)" style="filter: blur(12px);" />
      <ellipse cx="774" cy="505" rx="103.2" ry="62.4" fill="#3A6332" opacity="0.12" transform="rotate(36 764 510)" style="filter: blur(8px);" />

      <ellipse cx="25" cy="530" rx="208" ry="94" fill="#faf7f2" opacity="0.15" transform="rotate(103 25 530)" style="filter: blur(12px);" />
      <ellipse cx="35" cy="525" rx="124.8" ry="56.4" fill="#3A6332" opacity="0.12" transform="rotate(103 25 530)" style="filter: blur(8px);" />

      <ellipse cx="1071" cy="461" rx="176" ry="113" fill="#faf7f2" opacity="0.15" transform="rotate(28 1071 461)" style="filter: blur(12px);" />
      <ellipse cx="1081" cy="456" rx="105.6" ry="67.8" fill="#3A6332" opacity="0.12" transform="rotate(28 1071 461)" style="filter: blur(8px);" />

      <ellipse cx="518" cy="178" rx="133" ry="120" fill="#faf7f2" opacity="0.15" transform="rotate(49 518 178)" style="filter: blur(12px);" />
      <ellipse cx="528" cy="173" rx="79.8" ry="72" fill="#3A6332" opacity="0.12" transform="rotate(49 518 178)" style="filter: blur(8px);" />



      <g transform="rotate(3 346 200)">
        <rect x="110" y="93" width="472" height="214" rx="6" fill="#3A6332" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(0 384.5 342)">
        <rect x="187" y="204" width="395" height="276" rx="6" fill="#3A6332" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-4 455.5 296)">
        <rect x="238" y="136" width="435" height="320" rx="6" fill="#d69e2e" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="1001,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1021,157.5 1001,0" fill="#FCF9F2" opacity="0.9" stroke="#3A6332" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(6 536 35)" filter="url(#soft-shadow)">
      <rect x="476" y="23" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="476" y1="23" x2="476" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="596" y1="23" x2="596" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 960 55 Q 960 67 972 67 Q 960 67 960 79 Q 960 67 948 67 Q 960 67 960 55 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1005 97 Q 1005 105 1013 105 Q 1005 105 1005 113 Q 1005 105 997 105 Q 1005 105 1005 97 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 40 112 C 50 97, 35 77, 55 62" />
      <circle cx="44" cy="97" r="3" fill="#3A6332" opacity="0.5" />
      <circle cx="50" cy="80" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 92 589 Q 232 589 371 591" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 102 592 Q 232 592 361 591" stroke="#3A6332" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSY GAZETTE • WORDS</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#3A6332" stroke-width="1.2" />
        <text x="54" y="474" fill="#3A6332" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">WORDS • Vol. 2026.09</text>
        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Basta dire 'Molto'! 50 aggettivi</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">forti per arricchire il tuo</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">vocabolario</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>