      <path d="M 1042 58 Q 1042 70 1054 70 Q 1042 70 1042 82 Q 1042 70 1030 70 Q 1042 70 1042 58 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1087 100 Q 1087 108 1095 108 Q 1087 108 1087 116 Q 1087 108 1079 108 Q 1087 108 1087 100 Z" stroke="#faf7f2" stroke-width="1" />
