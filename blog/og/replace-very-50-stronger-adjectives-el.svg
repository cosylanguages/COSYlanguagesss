<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="tea-stain" data-seed="replace-very-50-stronger-adjectives-el" data-lang="el">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <ellipse cx="649" cy="150" rx="202" ry="132" fill="#faf7f2" opacity="0.15" transform="rotate(207 649 150)" style="filter: blur(12px);" />
      <ellipse cx="659" cy="145" rx="121.19999999999999" ry="79.2" fill="#236583" opacity="0.12" transform="rotate(207 649 150)" style="filter: blur(8px);" />

      <ellipse cx="968" cy="615" rx="188" ry="72" fill="#faf7f2" opacity="0.15" transform="rotate(294 968 615)" style="filter: blur(12px);" />
      <ellipse cx="978" cy="610" rx="112.8" ry="43.199999999999996" fill="#236583" opacity="0.12" transform="rotate(294 968 615)" style="filter: blur(8px);" />

      <ellipse cx="1081" cy="79" rx="108" ry="69" fill="#faf7f2" opacity="0.15" transform="rotate(177 1081 79)" style="filter: blur(12px);" />
      <ellipse cx="1091" cy="74" rx="64.8" ry="41.4" fill="#236583" opacity="0.12" transform="rotate(177 1081 79)" style="filter: blur(8px);" />

      <ellipse cx="319" cy="81" rx="202" ry="123" fill="#faf7f2" opacity="0.15" transform="rotate(188 319 81)" style="filter: blur(12px);" />
      <ellipse cx="329" cy="76" rx="121.19999999999999" ry="73.8" fill="#236583" opacity="0.12" transform="rotate(188 319 81)" style="filter: blur(8px);" />

      <ellipse cx="954" cy="622" rx="156" ry="122" fill="#faf7f2" opacity="0.15" transform="rotate(316 954 622)" style="filter: blur(12px);" />
      <ellipse cx="964" cy="617" rx="93.6" ry="73.2" fill="#236583" opacity="0.12" transform="rotate(316 954 622)" style="filter: blur(8px);" />

      <ellipse cx="379" cy="284" rx="197" ry="73" fill="#faf7f2" opacity="0.15" transform="rotate(227 379 284)" style="filter: blur(12px);" />
      <ellipse cx="389" cy="279" rx="118.19999999999999" ry="43.8" fill="#236583" opacity="0.12" transform="rotate(227 379 284)" style="filter: blur(8px);" />



      <g transform="rotate(-4 693.5 398)">
        <rect x="479" y="227" width="429" height="342" rx="6" fill="#d69e2e" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(7 628.5 273)">
        <rect x="432" y="105" width="393" height="336" rx="6" fill="#236583" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

