      <polygon points="226,137 23,318 -134,91 70,-70" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(6 531.5 372)">
